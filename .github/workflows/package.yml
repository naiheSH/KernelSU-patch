name: 自动打包 KernelSU Patch

# 权限配置 - 解决403错误
permissions:
  contents: write  # 授予写入权限，用于创建Release

# 触发条件
on:
  # 推送到 main 分支或推送标签时触发
  push:
    # 分支推送：CI 版构建
    branches: [ main ]
    # 标签推送：稳定版Release
    tags:
      - 'v*'  # 匹配 v1.0.0, v2.1.3 等格式的标签
    # 只在特定文件修改时触发（仅分支推送有效）
    paths:
      - 'patch.bat'
      - 'README.md'
      - '.github/workflows/package.yml'
  
  # 3. 手动触发（可选择 CI 版或稳定版）
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci  # CI 版，不创建正式Release
          - stable  # 稳定版，创建正式Release
      tag:
        description: '打包版本标签（仅稳定版有效）'
        required: false
        default: 'latest'
        type: string

# 工作流任务
jobs:
  build:
    # 使用 Ubuntu 最新版运行
    runs-on: ubuntu-latest
    
    steps:
    # 1. 检出代码
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 2. 显示目录结构（调试用）
    - name: 查看目录结构
      run: ls -la
    
    # 3. 直接从 GitHub 下载最新的 ko 文件
    - name: 从 GitHub 下载 ko 文件
      run: |
        # 创建 ko 目录（如果不存在）
        mkdir -p ko
        
        # 获取 GitHub 最新发布版本
        echo "=== 获取 GitHub 最新发布版本 ==="
        LATEST_RELEASE=$(curl -s -L -k "https://api.github.com/repos/tiann/KernelSU/releases/latest")
        LATEST_VERSION=$(echo $LATEST_RELEASE | grep -oP '(?<="tag_name": ")[^"]+')
        echo "最新版本: $LATEST_VERSION"
        
        # 要下载的.ko 文件列表
        FILES=("android12-5.10_kernelsu.ko" "android13-5.10_kernelsu.ko" "android13-5.15_kernelsu.ko" "android14-5.15_kernelsu.ko" "android14-6.1_kernelsu.ko" "android15-6.6_kernelsu.ko" "android16-6.12_kernelsu.ko")
        
        # 下载所有 ko 文件
        echo "=== 下载 ko 文件 ==="
        for FILE in "${FILES[@]}"; do
          DOWNLOAD_URL="https://github.com/tiann/KernelSU/releases/download/$LATEST_VERSION/$FILE"
          echo "下载 $FILE..."
          curl -L --retry 5 --retry-delay 3 -# -o "ko/$FILE" "$DOWNLOAD_URL"
          if [ -f "ko/$FILE" ]; then
            echo "✓ 下载完成！"
          else
            echo "✗ 下载失败！"
          fi
        done
        
        # 写入版本号到文件
        echo $LATEST_VERSION > ko/version.txt
        
        # 查看下载结果
        echo "=== ko 文件列表 ==="
        ls -la ko/

    # 4. 生成打包信息
    - name: 生成打包信息
      run: |
        # 获取当前时间
        CURRENT_TIME=$(date +"%Y%m%d_%H%M%S")
        
        # 写入打包信息文件
        cat > PACKAGE_INFO.md << EOF
        # KernelSU Patch 打包信息
        
        ## 版本信息
        - 打包时间: $(date)
        - Git 提交: ${{ github.sha }}
        - 打包标签: ${{ github.event.inputs.tag || 'latest' }}
        
        ## 包含文件
        - ko/
        - bin/
        - patch.bat
        - update_ko.bat
        - README.md
        - .gitattributes
        - PACKAGE_INFO.md
        
        ## 使用说明
        1. 将 boot.img/init_boot.img 放入 img 目录
        2. 运行 patch.bat
        3. 选择对应 GKI 版本
        4. 生成的内核镜像位于当前目录
        EOF
    
    # 5. 直接创建压缩包（确保文件直接在根目录，避免二次压缩）
    - name: 创建压缩包
      run: |
        # 确保文件编码正确（UTF-8 无 BOM）
        for file in patch.bat update_ko.bat; do
          if [[ -f $file ]]; then
            # 移除 BOM 并确保 UTF-8 编码
            sed -i '1s/^\xEF\xBB\xBF//' $file
            # 验证编码
            file -i $file
          fi
        done
        
        # 直接在根目录打包需要的文件，只压缩一次
        zip -r "kernelsu-patch-${{ github.event.inputs.tag || 'latest' }}.zip" \
          ko/ \
          bin/ \
          img/ \
          patch.bat \
          update_ko.bat \
          README.md \
          .gitattributes \
          PACKAGE_INFO.md \
          --exclude="*.git*" \
          --exclude="*.github*" \
          --exclude="*.zip"
        
        # 显示压缩结果和文件结构
        echo "=== 压缩结果 ==="
        ls -la *.zip
        echo "=== 压缩包内容 ==="
        unzip -l "kernelsu-patch-${{ github.event.inputs.tag || 'latest' }}.zip"
        
        # 清理临时文件
        rm -f PACKAGE_INFO.md
    
    # 6. 上传 ZIP 压缩包
    - name: 上传 ZIP 压缩包
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu-patch-zip
        path: kernelsu-patch-*.zip
        retention-days: 90
    
    # 7. 创建 GitHub Release（仅稳定版）
    - name: 创建 GitHub Release（稳定版）
      if: |
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'stable')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.tag }}
        name: KernelSU Patch ${{ github.ref_name || github.event.inputs.tag }}
        body: |
          # KernelSU Patch 稳定版发布
          
          ## 版本信息
          - 打包时间: ${{ github.event.head_commit.timestamp || '手动触发' }}
          - Git 提交: ${{ github.sha }}
          
          ## 包含文件
          - ko/ - KernelSU 内核模块
          - bin/ - 工具文件
          - patch.bat - 主补丁脚本
          - README.md - 使用说明
          
          ## 使用说明
          1. 将 boot.img/init_boot.img 放入 img 目录
          2. 运行 patch.bat
          3. 选择对应 GKI 版本
          4. 生成的内核镜像位于当前目录
        files: |
          kernelsu-patch-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: 自动打包 KernelSU Patch

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - '[vV]*'
    paths:
      - 'patch.bat'
      - 'patch.sh'
      - 'update_ko.bat'
      - 'bin/**'
      - 'ko/**'
      - 'README.md'
      - '.github/workflows/package.yml'

  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        default: 'ci'
        type: choice
        options:
          - ci
          - stable
      tag:
        description: '打包版本标签（仅稳定版有效）'
        required: false
        default: 'latest'
        type: string

jobs:
  # ========== 共享：下载 ko 文件 ==========
  build-ko:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 从 GitHub 下载 ko 文件
      run: |
        mkdir -p ko
        echo "=== 获取最新版本 ==="
        LATEST_VERSION=$(curl -s -L "https://github.com/tiann/KernelSU/releases/latest" | grep -oP 'releases/tag/\Kv[0-9.]+' | head -1)
        echo "最新版本: $LATEST_VERSION"

        if [ -z "$LATEST_VERSION" ]; then
          echo "错误: 无法获取最新版本号"
          exit 1
        fi

        FILES=("android12-5.10_kernelsu.ko" "android13-5.10_kernelsu.ko" "android13-5.15_kernelsu.ko" "android14-5.15_kernelsu.ko" "android14-6.1_kernelsu.ko" "android15-6.6_kernelsu.ko" "android16-6.12_kernelsu.ko")

        DOWNLOAD_SUCCESS=1
        for FILE in "${FILES[@]}"; do
          echo "下载 $FILE..."
          curl -s -L --retry 5 --retry-delay 3 -o "ko/$FILE" \
            "https://ghfast.top/https://github.com/tiann/KernelSU/releases/download/$LATEST_VERSION/$FILE"
          if [ -f "ko/$FILE" ]; then
            FILESIZE=$(stat -c%s "ko/$FILE")
            if [ "$FILESIZE" -lt 10240 ]; then
              echo "异常: $FILE 过小 ($FILESIZE 字节)"
              rm -f "ko/$FILE"
              DOWNLOAD_SUCCESS=0
            else
              echo "完成: $FILE ($FILESIZE 字节)"
            fi
          else
            echo "失败: $FILE"
            DOWNLOAD_SUCCESS=0
          fi
        done

        if [ "$DOWNLOAD_SUCCESS" -eq 1 ]; then
          echo "$LATEST_VERSION" > ko/version.txt
        else
          exit 1
        fi
        ls -la ko/

    - name: 上传 ko 产物
      uses: actions/upload-artifact@v4
      with:
        name: ko-files
        path: ko/
        retention-days: 90

  # ========== 各平台打包 ==========
  # ksud 二进制文件随仓库提交，CI 直接打包即可

  # ========== 各平台打包 ==========
  package:
    needs: build-ko
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 下载 ko 产物
      uses: actions/download-artifact@v4
      with:
        name: ko-files
        path: ko/

    - name: 安装工具
      run: sudo apt-get update && sudo apt-get install -y dos2unix zip

    - name: 打包所有平台
      run: |
        # 处理 bat 文件编码
        for file in patch.bat update_ko.bat; do
          cp $file temp.bat
          sed -i '1s/^\xEF\xBB\xBF//' temp.bat
          unix2dos temp.bat
          mv temp.bat $file
        done

        # 平台 → 脚本 → bin 源文件映射
        # bin/ 目录文件: ksud-windows-x64.exe, ksud-linux-x64, ksud-linux-arm64, ksud-android-x64, ksud-android-arm64
        declare -A SCRIPT_MAP KSUD_MAP
        SCRIPT_MAP=(
          ["windows-x64"]="patch.bat"
          ["linux-x64"]="patch.sh"
          ["linux-arm64"]="patch.sh"
          ["android-x64"]="patch.sh"
          ["android-arm64"]="patch.sh"
        )
        KSUD_MAP=(
          ["windows-x64"]="ksud-windows-x64.exe"
          ["linux-x64"]="ksud-linux-x64"
          ["linux-arm64"]="ksud-linux-arm64"
          ["android-x64"]="ksud-android-x64"
          ["android-arm64"]="ksud-android-arm64"
        )

        for PLATFORM in windows-x64 linux-x64 linux-arm64 android-x64 android-arm64; do
          SCRIPT="${SCRIPT_MAP[$PLATFORM]}"
          KSUD_SRC="${KSUD_MAP[$PLATFORM]}"
          OUTDIR="output-${PLATFORM}"

          echo "=== 打包 ${PLATFORM} ==="
          mkdir -p "${OUTDIR}/ko" "${OUTDIR}/bin" "${OUTDIR}/img"

          # 复制 ko 文件
          cp ko/* "${OUTDIR}/ko/"

          # 复制 ksud（重命名为平台统一名称）
          if [ -f "bin/${KSUD_SRC}" ]; then
            if [[ "$PLATFORM" == windows-* ]]; then
              cp "bin/${KSUD_SRC}" "${OUTDIR}/bin/ksud.exe"
            else
              cp "bin/${KSUD_SRC}" "${OUTDIR}/bin/ksud"
              chmod +x "${OUTDIR}/bin/ksud"
            fi
            echo "  ksud: OK ($(stat -c%s "bin/${KSUD_SRC}") 字节)"
          else
            echo "  警告: bin/${KSUD_SRC} 不存在"
          fi

          # 复制脚本和说明
          cp "${SCRIPT}" "${OUTDIR}/"
          cp README.md .gitattributes "${OUTDIR}/"

          # 打包
          cd "${OUTDIR}"
          zip -r "../kernelsu-patch-${PLATFORM}.zip" .
          cd ..
          echo "  输出: kernelsu-patch-${PLATFORM}.zip"
        done

        echo ""
        echo "=== 所有包 ==="
        ls -lh kernelsu-patch-*.zip

    - name: 上传所有平台产物
      uses: actions/upload-artifact@v4
      with:
        name: all-platforms
        path: kernelsu-patch-*.zip
        retention-days: 90

  # ========== 稳定版 Release ==========
  release:
    needs: package
    if: |
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'stable')
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码（获取提交历史）
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 下载所有产物
      uses: actions/download-artifact@v4
      with:
        name: all-platforms
        path: release/

    - name: 生成 Release 日志
      run: |
        TAG="${{ github.ref_name || github.event.inputs.tag }}"
        PREV_TAG=$(git tag --sort=-creatordate | grep -A1 "^${TAG}$" | tail -1)

        {
          echo "# KernelSU Patch ${TAG}"
          echo ""
          echo "## 更新内容"
          echo ""
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            echo "比较范围: ${PREV_TAG} → ${TAG}"
            echo ""
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}"
          else
            git log --pretty=format:"- %s (%h)" -20
          fi
          echo ""
          echo ""
          echo "## 下载"
          echo ""
          echo "| 平台 | 文件 |"
          echo "|------|------|"
          echo "| Windows x64 | \`kernelsu-patch-windows-x64.zip\` |"
          echo "| Linux x64 | \`kernelsu-patch-linux-x64.zip\` |"
          echo "| Linux ARM64 | \`kernelsu-patch-linux-arm64.zip\` |"
          echo "| Android x64 | \`kernelsu-patch-android-x64.zip\` |"
          echo "| Android ARM64 | \`kernelsu-patch-android-arm64.zip\` |"
          echo ""
          echo "## 使用方法"
          echo ""
          echo "1. 下载对应平台的压缩包并解压"
          echo "2. 将 \`boot.img\` 或 \`init_boot.img\` 放入 \`img/\` 目录"
          echo "3. Windows 运行 \`patch.bat\`，其他平台运行 \`./patch.sh\`"
          echo "4. 选择对应 GKI 版本，等待补丁完成"
        } > RELEASE_BODY.md

        echo "=== Release 日志 ==="
        cat RELEASE_BODY.md

    - name: 创建 GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.tag }}
        name: KernelSU Patch ${{ github.ref_name || github.event.inputs.tag }}
        body_path: RELEASE_BODY.md
        files: |
          release/kernelsu-patch-*.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
